<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Weather Stats{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <div class="nav-left">
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('stats') }}">Stats</a>
            <a href="{{ url_for('viz') }}">Visualizations</a>
            <a href="{{ url_for('predict') }}">Rain Prediction</a>
            <a href="{{ url_for('history') }}">History</a>
        </div>
        {% if username %}
        <div class="nav-right">
            {{ username }} | <a href="{{ url_for('logout') }}">Logout</a>
        </div>
        {% endif %}
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
